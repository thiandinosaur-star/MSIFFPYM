<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPM 2025 All-State · F4 + F5</title>
<style>
:root{--bg:#eef7f4;--panel:#fff;--ink:#101715;--muted:#53615d;--line:#111;--accent:#126b55;--accent2:#d9f2e9;--shadow:0 10px 28px #10251d18}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",Arial,sans-serif;font-size:17px}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:2px solid var(--line);box-shadow:var(--shadow);z-index:5}.brand{font-weight:1000;white-space:nowrap}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:700}.tabs{display:flex;gap:7px;overflow:auto;flex:1;padding:2px}.tab,.tool{border:2px solid #000;border-radius:10px;background:#fff;color:#111;padding:9px 12px;font:inherit;font-weight:900;cursor:pointer;white-space:nowrap}.tab.active{background:var(--accent);color:#fff;text-shadow:-1px -1px #000,1px -1px #000,-1px 1px #000,1px 1px #000}.tools{display:flex;gap:7px;align-items:center}.timer{min-width:92px;text-align:center;border:2px solid #000;background:#101715;color:#fff;border-radius:10px;padding:8px;font-variant-numeric:tabular-nums;font-weight:1000}.stage{position:relative;min-height:0}.frame{width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);font-weight:900}.loading.hide{display:none}.drawer{position:fixed;right:14px;top:78px;width:min(390px,calc(100vw - 28px));max-height:calc(100vh - 94px);overflow:auto;background:var(--panel);border:2px solid #000;border-radius:16px;padding:16px;box-shadow:0 18px 50px #0004;z-index:10}.drawer[hidden]{display:none}.drawer h2{margin:0 0 8px}.drawer p{color:var(--muted)}.subject-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #ccd9d5}.rating{display:flex;gap:4px}.rating button{border:2px solid #000;background:#fff;border-radius:8px;padding:5px 8px;font-weight:900;cursor:pointer}.rating button.on{background:#ffd85a}.rec{padding:12px;background:var(--accent2);border-left:5px solid var(--accent);border-radius:10px;margin:10px 0}.close{float:right;border:2px solid #000;border-radius:8px;background:#fff;font-weight:900;padding:5px 9px;cursor:pointer}.dark{--bg:#0f1715;--panel:#18221f;--ink:#f5f8f7;--muted:#c0cbc7;--accent:#2f9b7e;--accent2:#1e3d34}.dark .brand,.dark .drawer{color:#fff}.dark .tool{background:#fff;color:#111}@media(max-width:900px){body{font-size:16px}.top{flex-wrap:wrap}.brand{width:100%}.tools{width:100%;justify-content:flex-end}.stage{min-height:calc(100vh - 150px)}}
</style></head><body><div class="app"><header class="top"><div class="brand">SPM 2025 ALL-STATE<small>F4 + F5 · Study & Practice</small></div><nav class="tabs" id="tabs"></nav><div class="tools"><div class="timer" id="timer">00:00:00</div><button class="tool" id="smart">复习建议</button><button class="tool" id="theme">☾ 暗色</button></div></header><main class="stage"><div class="loading" id="loading">正在打开科目…</div><iframe class="frame" id="frame" title="SPM subject study page"></iframe></main></div>
<aside class="drawer" id="drawer" hidden><button class="close" id="close">×</button><h2>复习建议</h2><p>根据学习时间和自评分，优先显示需要加强的科目。</p><div class="rec" id="recommendation"></div><div id="subjectRows"></div></aside>
<script>
document.addEventListener("DOMContentLoaded",()=>{
const storage={getItem(k){try{return localStorage.getItem(k)}catch(e){return null}},setItem(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const META=[{"id":"sejarah","label":"Sejarah"},{"id":"math","label":"Mathematics"},{"id":"addmath","label":"Additional Mathematics"},{"id":"biology","label":"Biology"},{"id":"physics","label":"Physics"},{"id":"chemistry","label":"Chemistry"},{"id":"english","label":"Bahasa Inggeris"}];
const tabs=document.getElementById('tabs'), frame=document.getElementById('frame'), loading=document.getElementById('loading');
let current=storage.getItem('spm-current')||META[0].id, started=Date.now(), lastTick=Date.now();
if(!META.some(s=>s.id===current))current=META[0].id;
let stats={};try{stats=JSON.parse(storage.getItem('spm-study-stats')||'{}')||{};if(typeof stats!=='object'||Array.isArray(stats))stats={}}catch(e){}
META.forEach(s=>{if(!stats[s.id]||typeof stats[s.id]!=='object')stats[s.id]={seconds:0,rating:0};stats[s.id].seconds=Number(stats[s.id].seconds)||0;stats[s.id].rating=Number(stats[s.id].rating)||0;const b=document.createElement('button');b.className='tab';b.textContent=s.label;b.dataset.id=s.id;b.onclick=()=>openSubject(s.id);tabs.appendChild(b)});
function injectTheme(){try{const d=frame.contentDocument;if(!d)return;d.getElementById('parent-theme')?.remove();const st=d.createElement('style');st.id='parent-theme';st.textContent=document.body.classList.contains('dark')?'body{background:#0f1715!important;color:#f5f8f7!important}.main,.panel,.bookcard,.questionbox,.cmd,.state{background:#18221f!important;color:#f5f8f7!important}.hero{background:linear-gradient(135deg,#164638,#24735e)!important}.tiny,.source,p{color:#c5d0cc!important}input,select,.chapbtn,.ghost,details{background:#fff!important;color:#111!important}':'';d.head.appendChild(st)}catch(e){}}
function openSubject(id){current=id;storage.setItem('spm-current',id);loading.classList.remove('hide');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));frame.onload=()=>{loading.classList.add('hide');injectTheme()};frame.src='subjects/'+id+'.html'}
function save(){storage.setItem('spm-study-stats',JSON.stringify(stats))}
setInterval(()=>{const now=Date.now(),d=Math.max(0,Math.round((now-lastTick)/1000));lastTick=now;stats[current].seconds+=d;save();const t=Math.floor((now-started)/1000),h=String(Math.floor(t/3600)).padStart(2,'0'),m=String(Math.floor(t%3600/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');document.getElementById('timer').textContent=`${h}:${m}:${s}`},1000);
const drawer=document.getElementById('drawer');document.getElementById('smart').onclick=()=>{renderSmart();drawer.hidden=false};document.getElementById('close').onclick=()=>drawer.hidden=true;
function renderSmart(){const rows=document.getElementById('subjectRows');rows.innerHTML='';const ranked=[...META].sort((a,b)=>(stats[a.id].rating*900+stats[a.id].seconds)-(stats[b.id].rating*900+stats[b.id].seconds));const r=ranked[0];document.getElementById('recommendation').innerHTML=`建议先复习：<b>${r.label}</b><br><span style="font-size:14px">目前累计 ${Math.round(stats[r.id].seconds/60)} 分钟，自评分 ${stats[r.id].rating||'未填'}/5。</span>`;META.forEach(s=>{const row=document.createElement('div');row.className='subject-row';row.innerHTML=`<div><b>${s.label}</b><br><small>${Math.round(stats[s.id].seconds/60)} min</small></div><div class="rating"></div>`;const rr=row.querySelector('.rating');for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent=i;b.classList.toggle('on',stats[s.id].rating===i);b.onclick=()=>{stats[s.id].rating=i;save();renderSmart()};rr.appendChild(b)}rows.appendChild(row)})}
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');const on=document.body.classList.contains('dark');storage.setItem('spm-theme',on?'dark':'light');document.getElementById('theme').textContent=on?'☀ 亮色':'☾ 暗色';injectTheme()};
if(storage.getItem('spm-theme')==='dark')document.getElementById('theme').click();openSubject(current);
});
</script>

</body></html>
